name: StreamLab
options:
  bundleIdPrefix: com.example.streamlab
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: ""
packages:
  StreamLabCore:
    path: Packages/StreamLabCore
  StreamLabUI:
    path: Packages/StreamLabUI
targets:
  StreamLab:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamlab.demo
        PRODUCT_NAME: StreamLab
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: StreamLabCore
        product: StreamLabPresentation
      - package: StreamLabCore
        product: StreamLabDomain
      - package: StreamLabCore
        product: StreamLabCatalogData
      - package: StreamLabUI
        product: StreamLabDesignSystem
      - package: StreamLabUI
        product: StreamLabProfileFeature
      - package: StreamLabUI
        product: StreamLabCatalogFeature
  StreamLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/StreamLabUITests
    dependencies:
      - target: StreamLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamlab.demo.uitests
        TEST_TARGET_NAME: StreamLab
schemes:
  StreamLab:
    build:
      targets:
        StreamLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreamLabUITests
