name: StreamLab
options:
  bundleIdPrefix: com.example.streamlab
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
packages:
  StreamLabCore:
    path: Packages/StreamLabCore
targets:
  StreamLab:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Resources/Main.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamlab.demo
        PRODUCT_NAME: StreamLab
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: StreamLabCore
        product: StreamLabDomain
      - package: StreamLabCore
        product: StreamLabCatalogData
schemes:
  StreamLab:
    build:
      targets:
        StreamLab: all
    run:
      config: Debug
