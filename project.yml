name: StreamLab
options:
  bundleIdPrefix: com.example.streamlab
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: ""
packages:
  StreamLabCore:
    path: Packages/StreamLabCore
  StreamLabUI:
    path: Packages/StreamLabUI
targets:
  StreamLab:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
        excludes:
          - Configuration/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamlab.demo
        PRODUCT_NAME: StreamLab
        # Explicit metadata-processor dependency; verify on the target Xcode version.
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "AppIntents"]
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Configuration/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: StreamLabCore
        product: StreamLabPresentation
      - package: StreamLabCore
        product: StreamLabDomain
      - package: StreamLabCore
        product: StreamLabCatalogData
      - package: StreamLabUI
        product: StreamLabDesignSystem
      - package: StreamLabUI
        product: StreamLabProfileFeature
      - package: StreamLabUI
        product: StreamLabCatalogFeature
  StreamLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/StreamLabUITests
    dependencies:
      - target: StreamLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamlab.demo.uitests
        TEST_TARGET_NAME: StreamLab
        # The test bundle runs its own AppIntents metadata extraction step.
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "AppIntents"]
schemes:
  StreamLab:
    build:
      targets:
        StreamLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreamLabUITests

  # Opt-in allocation backtraces; keep normal runs/performance measurements separate.
  StreamLab-Memory:
    build:
      targets:
        StreamLab: all
    run:
      config: Debug
      environmentVariables:
        MallocStackLogging: "1"
    profile:
      config: Release
      environmentVariables:
        MallocStackLogging: "1"
